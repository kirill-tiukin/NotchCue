name: notch-cue
options:
  bundleIdPrefix: com.notchcue
  deploymentTarget:
    macOS: "14.0"
packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: 0.2.1
targets:
  notch-cue:
    type: application
    platform: macOS
    sources:
      - path: notch-cue
    dependencies:
      - package: HotKey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchcue.app
        PRODUCT_NAME: NotchCue
        INFOPLIST_KEY_CFBundleDisplayName: NotchCue
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSUIElement: "YES"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "NotchCue uses the microphone for voice-activated scrolling."
